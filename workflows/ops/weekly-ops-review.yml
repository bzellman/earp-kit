# TEMPLATE: Replace project-specific paths and values marked with <YOUR_*> placeholders.
# Project paths (<YOUR_APP>/, <YOUR_API_PROJECT>/, Infrastructure/) should be adapted to your repo structure.

# Weekly Ops Review
# Collects read-only performance and cost telemetry per environment, then
# aggregates the findings into a parent GitHub issue plus deduplicated child issues.

name: Weekly Ops Review

on:
  schedule:
    # Sunday 8:00 PM America/Chicago.
    # 01:00 UTC Monday during daylight time, 02:00 UTC Monday during standard time.
    - cron: '0 1 * * 1'
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - weekly
      environments:
        description: 'Comma-separated environments'
        required: true
        default: 'dev,staging,prod'
        type: string
      publish:
        description: 'Create or update GitHub issues'
        required: true
        default: true
        type: boolean

concurrency:
  group: weekly-ops-review-${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.mode || 'manual' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Inputs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      mode: ${{ steps.resolve.outputs.mode }}
      publish: ${{ steps.resolve.outputs.publish }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - name: Validate and normalize inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ENVIRONMENTS: ${{ inputs.environments }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          from zoneinfo import ZoneInfo

          valid = {"dev", "staging", "prod"}
          event_name = os.environ.get("EVENT_NAME", "workflow_dispatch")

          if event_name == "schedule":
              now_chicago = dt.datetime.now(dt.timezone.utc).astimezone(ZoneInfo("America/Chicago"))
              should_run = now_chicago.weekday() == 6 and now_chicago.hour == 20
              envs = ["dev", "staging", "prod"]
              mode = "weekly"
              publish = "true"
          else:
              should_run = True
              raw_envs = os.environ.get("INPUT_ENVIRONMENTS", "dev,staging,prod")
              envs = [item.strip() for item in raw_envs.split(",") if item.strip()]
              mode = os.environ.get("INPUT_MODE", "manual")
              publish = os.environ.get("INPUT_PUBLISH", "true").lower()

          if not envs:
              print("No environments provided", file=sys.stderr)
              raise SystemExit(1)

          invalid = [env for env in envs if env not in valid]
          if invalid:
              print(f"Invalid environments: {', '.join(invalid)}", file=sys.stderr)
              raise SystemExit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={json.dumps(sorted(set(envs)))}\n")
              handle.write(f"mode={mode}\n")
              handle.write(f"publish={publish}\n")
              handle.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

  collect:
    name: Collect (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.should_run == 'true'
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      TARGET_ENV: ${{ matrix.environment }}
      RUN_MODE: ${{ needs.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Resolve GCP project config
        id: gcp
        uses: ./.github/actions/gcp-project-config
        with:
          environment: ${{ env.TARGET_ENV }}

      - name: Validate GCP project number secret
        env:
          PROJECT_NUMBER: ${{ secrets[steps.gcp.outputs.project_number_secret] }}
        run: |
          if [ -z "$PROJECT_NUMBER" ]; then
            echo "::error::${{ steps.gcp.outputs.project_number_secret }} is not configured for the '$TARGET_ENV' environment."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: 'projects/${{ secrets[steps.gcp.outputs.project_number_secret] }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: ${{ steps.gcp.outputs.ops_review_sa }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ steps.gcp.outputs.project_id }}

      - name: Collect environment telemetry
        run: |
          python3 .github/scripts/weekly_ops_review.py collect \
            --environment "$TARGET_ENV" \
            --mode "$RUN_MODE" \
            --output-dir "out/$TARGET_ENV"

      - name: Upload environment artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: weekly-ops-${{ env.TARGET_ENV }}
          path: out/${{ env.TARGET_ENV }}/*.json
          retention-days: 14

  aggregate:
    name: Aggregate and Publish
    runs-on: ubuntu-latest
    needs: [resolve, collect]
    if: always() && needs.resolve.outputs.should_run == 'true'
    permissions:
      contents: read
      issues: write
    env:
      RUN_MODE: ${{ needs.resolve.outputs.mode }}
      PUBLISH: ${{ needs.resolve.outputs.publish }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: aggregate/in
          merge-multiple: true

      - name: Aggregate report and issues
        run: |
          python3 .github/scripts/weekly_ops_review.py aggregate \
            --mode "$RUN_MODE" \
            --input-dir "aggregate/in" \
            --output-dir "aggregate/out" \
            --publish "$PUBLISH" \
            --run-url "$RUN_URL"

      - name: Upload aggregate outputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: weekly-ops-review
          path: aggregate/out/*
          retention-days: 30

      - name: Publish workflow summary
        run: |
          echo "## Weekly Ops Review" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat aggregate/out/weekly-ops-review.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          summary = json.loads(Path("aggregate/out/weekly-ops-review.json").read_text())
          parent = summary.get("parent_issue") or {}
          print("")
          print("## Publishing")
          print("")
          print(f"- Workflow run: {summary.get('run_url') or 'n/a'}")
          print(f"- Candidate count: **{summary.get('candidate_count', 0)}**")
          print(f"- Candidates above threshold: **{summary.get('candidate_count_above_threshold', 0)}**")
          print(f"- Published child issues: **{summary.get('published_count', 0)}**")
          if parent.get("url"):
              print(f"- Parent issue: {parent['url']}")
          else:
              print("- Parent issue: not published")
          PY
